name: build-rootfsd

on:
  workflow_dispatch:
  push:
    paths:
      - "rootfsd/**"
      - "magisk/**"
      - ".github/workflows/build-rootfsd.yml"

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: false

      - name: Build rootfsd (arm64, static)
        run: |
          cd rootfsd
          go mod tidy
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 \
            go build -trimpath -ldflags="-s -w" -o ../magisk/rootfsd .

      - name: Package Magisk module
        run: |
          chmod +x magisk/rootfsd magisk/service.sh magisk/uninstall.sh
          cd magisk
          zip -r ../vlcrootfs-magisk.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: vlcrootfs-magisk
          path: vlcrootfs-magisk.zip
          if-no-files-found: error
