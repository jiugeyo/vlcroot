name: build-apk

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    # 固定 24.04：ubuntu-latest 正在迁移到 26.04，Android SDK 的位置/内容不稳定
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: false

      - name: Build rootfsd asset
        run: |
          cd rootfsd
          go mod tidy
          go mod vendor
          python3 ../scripts/patch_go_fuse.py
          mkdir -p ../app/src/main/assets
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 \
            go build -mod=vendor -trimpath -ldflags="-s -w" -o ../app/src/main/assets/rootfsd-arm64 .

      # GitHub 的 ubuntu 镜像自带 Android SDK，直接用，避免第三方 action 失效
      - name: Configure Android SDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SM" ]; then
            SM=$(find "$SDK/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n1)
          fi
          if [ -z "$SM" ] || [ ! -x "$SM" ]; then
            echo "sdkmanager not found under $SDK"; find "$SDK" -maxdepth 3 -type d; exit 1
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "SDKMANAGER=$SM" >> "$GITHUB_ENV"
          echo "$(dirname "$SM")" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "SDK=$SDK"
          echo "SDKMANAGER=$SM"
          ls "$SDK"
          "$SM" --version

      - name: Install SDK packages
        run: |
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Toolchain info
        run: |
          java -version
          gradle --version

      - name: Build unsigned release APK
        run: |
          set -o pipefail
          gradle :app:assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Annotate build errors
        if: failure()
        run: |
          grep -nE "^e: |error:|FAILURE:|What went wrong" build.log | head -40 | while IFS= read -r line; do
            echo "::error file=build.log::$line"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: vlcroot-unsigned-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
